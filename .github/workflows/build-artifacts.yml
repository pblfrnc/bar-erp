name: Build Android APK & Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Compilar Executável Windows (.EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências Gerais
        run: |
          npm install
          npm --prefix server install
          npm --prefix client install

      - name: Preparar Banco de Dados (seed inicial)
        env:
          DATABASE_URL: "file:./server/prisma/dev.db"
        working-directory: server
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss
          npm run seed

      - name: Compilar Backend (esbuild bundle + copia engine Prisma)
        working-directory: server
        run: |
          npm run build

      - name: Compilar Frontend
        working-directory: client
        run: |
          npm run build

      - name: Gerar Executável Windows (.EXE)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win --publish never

      - name: Salvar Artefato Windows (.EXE)
        uses: actions/upload-artifact@v4
        with:
          name: BarERP-Windows-Executavel
          path: dist-electron/*.exe

  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'


      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: |
          npm install
          npm --prefix server install
          npm --prefix client install

      - name: Dar permissão ao Gradle Wrapper
        run: |
          chmod +x client/android/gradlew

      - name: Compilar APK do Garçom (Android)
        working-directory: client
        run: |
          npm run build:waiter
          npx cap sync android
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ../..
          mkdir -p output-apk/waiter
          cp client/android/app/build/outputs/apk/debug/app-debug.apk output-apk/waiter/BarERP-Garcom.apk

      - name: Compilar APK da Cozinha / KDS (Android)
        working-directory: client
        run: |
          npm run build:kds
          sed -i 's/"appId": "com.barerp.app"/"appId": "com.barerp.kds"/g' capacitor.config.json

          sed -i 's/applicationId "com.barerp.app"/applicationId "com.barerp.kds"/g' android/app/build.gradle

          npx cap sync android
          sed -i 's/BarERP Garçom/BarERP Cozinha/g' android/app/src/main/res/values/strings.xml
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ../..
          mkdir -p output-apk/kitchen
          cp client/android/app/build/outputs/apk/debug/app-debug.apk output-apk/kitchen/BarERP-Cozinha.apk

      - name: Salvar Artefato APK do Garçom
        uses: actions/upload-artifact@v4
        with:
          name: BarERP-Garcom-APK
          path: output-apk/waiter/BarERP-Garcom.apk

      - name: Salvar Artefato APK da Cozinha
        uses: actions/upload-artifact@v4
        with:
          name: BarERP-Cozinha-APK
          path: output-apk/kitchen/BarERP-Cozinha.apk

  publish-release:
    name: Publicar Release Automática (latest)
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar Executável Windows
        uses: actions/download-artifact@v4
        with:
          name: BarERP-Windows-Executavel
          path: release-files/

      - name: Baixar APK Garçom
        uses: actions/download-artifact@v4
        with:
          name: BarERP-Garcom-APK
          path: release-files/

      - name: Baixar APK Cozinha
        uses: actions/download-artifact@v4
        with:
          name: BarERP-Cozinha-APK
          path: release-files/

      - name: Criar/Atualizar Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-files/*"
          tag: "latest"
          name: "BarERP - Versão de Produção"
          body: "Baixe aqui os instaladores da última versão do BarERP.\n\n- **.EXE**: Instalador para o computador (Caixa/Servidor)\n- **Garcom.apk**: App Android para os garçons tirarem pedidos\n- **Cozinha.apk**: App Android para exibir a fila de pratos na cozinha"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
