name: Build Android APK & Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Compilar Executável Windows (.EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências Gerais
        run: |
          npm install
          npm --prefix server install
          npm --prefix client install

      - name: Preparar Banco de Dados (seed inicial)
        env:
          DATABASE_URL: "file:./server/prisma/dev.db"
        working-directory: server
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss
          npm run seed

      - name: Compilar Backend (esbuild bundle + copia engine Prisma)
        working-directory: server
        run: |
          npm run build

      - name: Compilar Frontend
        working-directory: client
        run: |
          npm run build

      - name: Gerar Executável Windows (.EXE)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win --publish never

      - name: Salvar Artefato Windows (.EXE)
        uses: actions/upload-artifact@v4
        with:
          name: BarERP-Windows-Executavel
          path: dist-electron/*.exe

  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'


      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: |
          npm install
          npm --prefix server install
          npm --prefix client install

      - name: Dar permissão ao Gradle Wrapper
        run: |
          chmod +x client/android/gradlew

      - name: Garantir Chave de Assinatura Release
        working-directory: client/android/app
        run: |
          if [ ! -f release.keystore ]; then
            echo "release.keystore não encontrada, criando chave de release..."
            keytool -genkeypair -v -keystore release.keystore \
              -alias barerp -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass barerp123 -keypass barerp123 \
              -dname "CN=BarERP, OU=Tecnologia, O=BarERP, L=Sao Paulo, ST=SP, C=BR"
          else
            echo "Chave release.keystore existente encontrada!"
          fi

      - name: Compilar APK do Garçom (Android)
        working-directory: client
        run: |
          npm run build:waiter
          npx cap sync android
          cd android
          ./gradlew assembleRelease --no-daemon
          cd ../..
          mkdir -p output-apk/waiter
          if [ -f client/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp client/android/app/build/outputs/apk/release/app-release.apk output-apk/waiter/BarERP-Garcom.apk
          else
            find client/android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} output-apk/waiter/BarERP-Garcom.apk \;
          fi

      - name: Compilar APK da Cozinha / KDS (Android)
        working-directory: client
        run: |
          npm run build:kds
          sed -i 's/"appId": "com.barerp.app"/"appId": "com.barerp.kds"/g' capacitor.config.json

          sed -i 's/applicationId "com.barerp.app"/applicationId "com.barerp.kds"/g' android/app/build.gradle

          npx cap sync android
          sed -i 's/BarERP Garçom/BarERP Cozinha/g' android/app/src/main/res/values/strings.xml
          cd android
          ./gradlew assembleRelease --no-daemon
          cd ../..
          mkdir -p output-apk/kitchen
          if [ -f client/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp client/android/app/build/outputs/apk/release/app-release.apk output-apk/kitchen/BarERP-Cozinha.apk
          else
            find client/android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} output-apk/kitchen/BarERP-Cozinha.apk \;
          fi

      - name: Salvar Artefato APK do Garçom
        uses: actions/upload-artifact@v4
        with:
          name: BarERP-Garcom-APK
          path: output-apk/waiter/BarERP-Garcom.apk

      - name: Salvar Artefato APK da Cozinha
        uses: actions/upload-artifact@v4
        with:
          name: BarERP-Cozinha-APK
          path: output-apk/kitchen/BarERP-Cozinha.apk

  publish-release:
    name: Publicar Release Automática (latest)
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar Executável Windows
        uses: actions/download-artifact@v4
        with:
          name: BarERP-Windows-Executavel
          path: release-files/

      - name: Baixar APK Garçom
        uses: actions/download-artifact@v4
        with:
          name: BarERP-Garcom-APK
          path: release-files/

      - name: Baixar APK Cozinha
        uses: actions/download-artifact@v4
        with:
          name: BarERP-Cozinha-APK
          path: release-files/

      - name: Sanitizar nomes de arquivos (remover espaços se houver)
        run: |
          cd release-files
          for f in *\ *; do
            [ -f "$f" ] && mv "$f" "${f// /-}"
          done
          echo "Arquivos para publicação na release:"
          ls -la

      - name: Publicar ou Atualizar Release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          TITLE="BarERP - Versão de Produção"
          BODY="Baixe aqui os instaladores atualizados da última versão do BarERP:\n\n- **Windows**: Instalador (.exe) e Versão Portátil (.exe) para Computador/Caixa\n- **BarERP-Garcom.apk**: App Android para os garçons tirarem pedidos nas mesas\n- **BarERP-Cozinha.apk**: App Android para a cozinha exibir a fila de pedidos (KDS)"

          # Ensure GitHub CLI is available (ubuntu-latest includes it, but we double‑check)
          if ! command -v gh > /dev/null; then
            echo "Instalando GitHub CLI..."
            sudo apt-get update && sudo apt-get install -y gh
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release '$TAG' já existente. Atualizando informações e sobrescrevendo arquivos (--clobber)..."
            gh release edit "$TAG" --title "$TITLE" --notes "$BODY"
            for file in release-files/*; do
              if [ -f "$file" ]; then
                echo "Enviando $file..."
                gh release upload "$TAG" "$file" --clobber
              fi
            done
          else
            echo "Criando nova release '$TAG'..."
            gh release create "$TAG" release-files/* \
              --title "$TITLE" \
              --notes "$BODY" \
              --latest
          fi
          echo "Release publicada com sucesso!"
