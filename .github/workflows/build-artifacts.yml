name: Build Android APK & Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Compilar Executável Windows (.EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências Gerais
        run: |
          npm install
          npm --prefix server install
          npm --prefix client install

      - name: Preparar Banco e Gerar Prisma Client
        working-directory: server
        env:
          DATABASE_URL: "file:./dev.db"
        run: |
          npx prisma generate

      - name: Compilar Backend
        working-directory: server
        run: |
          npm run build

      - name: Compilar Frontend
        working-directory: client
        run: |
          npm run build

      - name: Gerar Executável Windows (.EXE)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win --publish never

      - name: Salvar Artefato Windows (.EXE)
        uses: actions/upload-artifact@v4
        with:
          name: BarERP-Windows-Executavel
          path: dist-electron/*.exe

  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependências
        run: |
          npm install
          npm --prefix server install
          npm --prefix client install

      - name: Compilar Frontend
        working-directory: client
        run: |
          npm run build

      - name: Sincronizar com Capacitor Android
        working-directory: client
        run: |
          npx cap sync android

      - name: Dar permissão ao Gradle Wrapper
        run: |
          chmod +x client/android/gradlew

      - name: Compilar APK Android (Debug)
        working-directory: client/android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Salvar Artefato Android (APK)
        uses: actions/upload-artifact@v4
        with:
          name: BarERP-Android-APK
          path: client/android/app/build/outputs/apk/debug/*.apk
